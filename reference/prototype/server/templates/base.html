<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Treehouse{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Treehouse home">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>treehouse
    </a>
    {% if nav.signed_in %}
    <nav>
      <a href="/account">My account</a>
      {% if nav.admin %}<a href="/admin">People &amp; invites</a>{% endif %}
      <form method="post" action="/logout"><button class="link">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
