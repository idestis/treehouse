[workspace]
resolver = "3"
members = ["server", "desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Stripping proc-macro dylibs corrupts them on recent macOS ("mis-aligned
# LINKEDIT string pool"); only strip the final binaries.
[profile.release.build-override]
strip = false
debug = false
