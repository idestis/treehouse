# git-cliff config for release notes people read: the GitHub release and the in-app
# "Update available" notes (latest.json). Only changes a user can notice (feat, fix, perf),
# one line each, no bodies, no scopes, no PR numbers. CHANGELOG.md (cliff.toml) keeps the
# full developer history.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  # Squash merges end in "(#12)"; users don't need PR numbers.
  { pattern = '\s*\(#[0-9]+\)', replace = "" },
]
commit_parsers = [
  { message = "^[a-z]+\\((ci|docs|release|deps|build)\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
]
