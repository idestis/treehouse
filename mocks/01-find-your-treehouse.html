<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treehouse: find your treehouse</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/mock-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#121934}
a{color:#FFB347}a:hover{color:#FFD08A}
input::placeholder{color:#7C87A8}
input:focus{outline:none;border-color:#FFB347 !important;box-shadow:0 0 0 3px rgba(255,179,71,.22)}
a:focus-visible,button:focus-visible{outline:3px solid #FFB347;outline-offset:3px}
.tw-anim{position:absolute;pointer-events:none}
.tw-star{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle,#FFF6DD 0 22%,rgba(255,246,221,0) 70%);animation:tw-twinkle 4s ease-in-out infinite}
@keyframes tw-twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
.tw-bulb{width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.85),rgba(255,214,140,0) 65%);mix-blend-mode:screen;animation:tw-bulb 2.4s ease-in-out infinite}
@keyframes tw-bulb{0%,100%{opacity:.25}50%{opacity:1}}
.tw-window-candle{border-radius:4px;background:radial-gradient(circle at 40% 70%,rgba(255,200,110,.75),rgba(255,140,40,0) 75%);mix-blend-mode:screen;animation:tw-candle 2.6s linear infinite}
@keyframes tw-candle{0%{opacity:.55}11%{opacity:.25}19%{opacity:.6}31%{opacity:.15}44%{opacity:.5}58%{opacity:.3}71%{opacity:.65}86%{opacity:.2}100%{opacity:.55}}
.tw-window-electric{border-radius:3px;background:#2B1D16;animation:tw-switch 12s linear infinite}
@keyframes tw-switch{0%,62%{opacity:0}63%{opacity:.92}70%{opacity:.92}70.6%{opacity:0}71.2%{opacity:.6}71.8%{opacity:0}100%{opacity:0}}
.tw-ring{width:14%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.75);border-radius:50%;border:2px solid rgba(255,226,170,.7);animation:tw-ring 2.8s ease-out infinite}
@keyframes tw-ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.75)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
@media (prefers-reduced-motion: reduce){.tw-anim{animation:none !important;opacity:0 !important}}
</style>
</helmet>
<div style="width: 100%; min-height: 760px; box-sizing: border-box; background: #121934; color: #ECEFF8; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <div style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; overflow: hidden">
    <div style="position: relative; width: 100%; max-width: 640px; aspect-ratio: 1448 / 1086">
        <img src="assets/left-side-pic.jpg" alt="A lit treehouse in a tree at night, with a crescent moon, string lights and a voice bubble" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
        <span class="tw-anim tw-window-electric" style="left: 33.80%; top: 43.30%; width: 6.10%; height: 7.90%"></span>
        <span class="tw-anim tw-window-candle" style="left: 41.70%; top: 42.80%; width: 8.50%; height: 9.60%"></span>
        <span class="tw-anim tw-ring" style="left: 59.25%; top: 39.80%"></span>
        <span class="tw-anim tw-ring" style="left: 59.25%; top: 39.80%; animation-delay: 1.4s"></span>
        <span class="tw-anim tw-star" style="left: 27.14%; top: 12.52%; animation-delay: 0s; animation-duration: 3.2s"></span>
        <span class="tw-anim tw-star" style="left: 54.21%; top: 10.31%; animation-delay: 1.1s; animation-duration: 4.4s"></span>
        <span class="tw-anim tw-star" style="left: 20.10%; top: 20.26%; animation-delay: 2.2s; animation-duration: 3.8s"></span>
        <span class="tw-anim tw-star" style="left: 76.73%; top: 18.78%; animation-delay: 0.6s; animation-duration: 5s"></span>
        <span class="tw-anim tw-star" style="left: 81.70%; top: 24.95%; animation-delay: 1.8s; animation-duration: 4.1s"></span>
        <span class="tw-anim tw-star" style="left: 17.75%; top: 31.95%; animation-delay: 2.9s; animation-duration: 3.5s"></span>
        <span class="tw-anim tw-star" style="left: 70.37%; top: 47.79%; animation-delay: 0.3s; animation-duration: 4.8s"></span>
        <span class="tw-anim tw-star" style="left: 78.45%; top: 54.24%; animation-delay: 3.4s; animation-duration: 4.2s"></span>
        <span class="tw-anim tw-star" style="left: 68.37%; top: 62.43%; animation-delay: 2.0s; animation-duration: 5.4s"></span>
        <span class="tw-anim tw-star" style="left: 26.66%; top: 72.10%; animation-delay: 1.4s; animation-duration: 3.9s"></span>
        <span class="tw-anim tw-bulb" style="left: 30.66%; top: 57.18%; animation-delay: 0s"></span>
        <span class="tw-anim tw-bulb" style="left: 35.36%; top: 57.27%; animation-delay: 0.5s"></span>
        <span class="tw-anim tw-bulb" style="left: 40.40%; top: 58.47%; animation-delay: 1s"></span>
        <span class="tw-anim tw-bulb" style="left: 45.30%; top: 58.75%; animation-delay: 1.5s"></span>
        <span class="tw-anim tw-bulb" style="left: 49.86%; top: 57.64%; animation-delay: 2s"></span>
      </div>
  </div>

  <div style="flex: 1 1 380px; min-width: 0; display: flex; align-items: center; padding: 48px; box-sizing: border-box">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">
        <img src="assets/treehouse-logo.png" alt="" width="36" height="36" style="border-radius: 10px; display: block">
        treehouse
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -0.035em">Find your treehouse</h1>
        <p style="margin: 0; color: #A9B1CC; font-size: 17px; line-height: 1.5">Type the address your friend gave you. You only do this once.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
        <label for="server" style="font-weight: 700; font-size: 15px">Server address</label>
        <input id="server" placeholder="owls.example.net" spellcheck="false" autocomplete="url" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 14px 16px">
        <a href="02-sign-in.html" style="display: block; text-align: center; text-decoration: none; background: #FFB347; color: #2A1700; font-weight: 700; font-size: 17px; border-radius: 12px; padding: 15px 20px; margin-top: 4px">Continue</a>
      </form>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; color: #A9B1CC; font-size: 14px">Been here before</p>
        <a href="02-sign-in.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; background: #141C31; border: 1.5px solid #222D49; text-decoration: none; color: #ECEFF8">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #2B2350; display: grid; place-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #C9B8FF">N</span>
          <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
            <span style="font-weight: 700">Night Owls</span>
            <span style="color: #A9B1CC; font-size: 14px">owls.example.net</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9B1CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
