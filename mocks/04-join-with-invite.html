<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treehouse: join with an invite</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/mock-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E1322}
a{color:#FFB347}a:hover{color:#FFD08A}
input::placeholder{color:#7C87A8}
input:focus{outline:none;border-color:#FFB347 !important;box-shadow:0 0 0 3px rgba(255,179,71,.22)}
a:focus-visible,button:focus-visible{outline:3px solid #FFB347;outline-offset:3px}
</style>
</helmet>
<div style="width: 100%; min-height: 760px; box-sizing: border-box; background: radial-gradient(circle at 50% -10%, #1B2547 0%, #0E1322 60%); color: #ECEFF8; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; padding: 40px 24px">
  <div style="width: 100%; max-width: 920px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">

    <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; color: #A9B1CC; font-size: 15px">Joining <strong style="color: #ECEFF8">Night Owls</strong> at owls.example.net</p>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.035em">You’re invited</h1>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="code" style="font-weight: 700; font-size: 15px">Invite code</label>
          <input id="code" value="8XX9W-33KQC" spellcheck="false" style="font: inherit; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: 0.12em; font-size: 20px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 12px 16px">
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px">
          <div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px">
            <label for="nick" style="font-weight: 700; font-size: 15px">Name your crew sees</label>
            <input id="nick" value="{{ name }}" onInput="{{ setName }}" maxlength="24" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 12px 16px">
          </div>
          <div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px">
            <label for="uname" style="font-weight: 700; font-size: 15px">Username</label>
            <input id="uname" value="ana_k" spellcheck="false" autocomplete="username" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 12px 16px">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pw" style="font-weight: 700; font-size: 15px">Password</label>
          <input id="pw" type="password" placeholder="At least 10 characters" autocomplete="new-password" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 12px 16px">
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 10px">Your color</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{ colors }}" as="c" hint-placeholder-count="8">
              <button type="button" onClick="{{ c.pick }}" aria-label="{{ c.label }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}"></button>
            </sc-for>
          </div>
        </fieldset>
        <a href="05-deck-and-voice-rooms.html" style="display: block; text-align: center; text-decoration: none; background: #FFB347; color: #2A1700; font-weight: 700; font-size: 17px; border-radius: 12px; padding: 15px 20px; margin-top: 6px">Create account and climb in</a>
      </form>
      <a href="02-sign-in.html" style="color: #A9B1CC; text-decoration: none; font-size: 15px">I already have an account</a>
    </div>

    <div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px; align-items: center">
      <div style="{{ previewStyle }}">
        <span style="{{ avatarStyle }}">{{ initial }}</span>
        <span style="position: absolute; left: 14px; bottom: 14px; background: rgba(14,19,34,.75); padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 14px">{{ name }}</span>
      </div>
      <p style="margin: 0; color: #A9B1CC; font-size: 14px">This is how friends see you in a room.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Ana', color: '#E5487D' };
  }
  renderVals() {
    const palette = [
      ['#3F8EFC', 'Sky'], ['#12A594', 'Teal'], ['#2FA84F', 'Leaf'], ['#E8A317', 'Sun'],
      ['#F0663A', 'Tangerine'], ['#E5487D', 'Berry'], ['#8B5CF6', 'Grape'], ['#7C8BA8', 'Slate']
    ];
    const color = this.state.color;
    const name = this.state.name;
    return {
      name,
      initial: (name.trim()[0] || '?').toUpperCase(),
      setName: (e) => this.setState({ name: e.target.value }),
      colors: palette.map(([hex, label]) => ({
        label,
        pressed: hex === color ? 'true' : 'false',
        pick: () => this.setState({ color: hex }),
        style: 'width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; background: ' + hex + '; box-shadow: ' +
          (hex === color ? '0 0 0 3px #0E1322, 0 0 0 6px #ECEFF8' : '0 0 0 3px #0E1322')
      })),
      previewStyle: 'position: relative; width: 100%; max-width: 300px; height: 210px; border-radius: 20px; display: grid; place-items: center; background: color-mix(in srgb, ' + color + ' 22%, #182238); border: 2px solid #FFB347; box-shadow: 0 0 0 5px rgba(255,179,71,.16), 0 0 48px rgba(255,179,71,.28)',
      avatarStyle: 'width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: ' + color + '; color: #fff; font-family: Bricolage Grotesque, sans-serif; font-weight: 800; font-size: 40px'
    };
  }
}
</script>
</body>
</html>
