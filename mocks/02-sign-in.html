<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treehouse: sign in</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/mock-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0E1322}
a{color:#FFB347}a:hover{color:#FFD08A}
input::placeholder{color:#7C87A8}
input:focus{outline:none;border-color:#FFB347 !important;box-shadow:0 0 0 3px rgba(255,179,71,.22)}
a:focus-visible,button:focus-visible{outline:3px solid #FFB347;outline-offset:3px}
</style>
</helmet>
<div style="width: 100%; min-height: 760px; box-sizing: border-box; background: radial-gradient(circle at 50% -10%, #1B2547 0%, #0E1322 60%); color: #ECEFF8; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; padding: 48px 24px">
  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px">

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 16px; background: #141C31; border: 1.5px solid #222D49">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #2B2350; display: grid; place-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #C9B8FF">N</span>
      <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-weight: 700">Night Owls</span>
        <span style="color: #A9B1CC; font-size: 14px">owls.example.net</span>
      </span>
      <a href="01-find-your-treehouse.html" style="font-size: 14px; font-weight: 700; text-decoration: none; padding: 10px 12px; border-radius: 10px">Change</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.035em">Climb back in</h1>
      <p style="margin: 0; color: #A9B1CC; font-size: 17px">Sign in to hang out with your crew.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="user" style="font-weight: 700; font-size: 15px">Username</label>
        <input id="user" value="max" autocomplete="username" spellcheck="false" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 14px 16px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="pass" style="font-weight: 700; font-size: 15px">Password</label>
        <input id="pass" type="password" value="supersecretpw" autocomplete="current-password" style="font: inherit; font-size: 17px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px; padding: 14px 16px">
      </div>
      <label style="display: flex; align-items: center; gap: 10px; color: #C4CAE0; font-size: 15px; cursor: pointer">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #FFB347; margin: 0">
        Keep me signed in on this computer
      </label>
      <a href="03-two-step-code.html" style="display: block; text-align: center; text-decoration: none; background: #FFB347; color: #2A1700; font-weight: 700; font-size: 17px; border-radius: 12px; padding: 15px 20px; margin-top: 4px">Sign in</a>
    </form>

    <div style="display: flex; align-items: center; gap: 14px; color: #A9B1CC; font-size: 14px">
      <span style="flex: 1; height: 1px; background: #26324F"></span>
      New here?
      <span style="flex: 1; height: 1px; background: #26324F"></span>
    </div>

    <a href="04-join-with-invite.html" style="display: block; text-align: center; text-decoration: none; color: #ECEFF8; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 14px 20px; border: 1.5px solid #2E3B5E">I have an invite code</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
