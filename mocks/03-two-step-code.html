        <input aria-label="Digit 3" value="1" maxlength="1" inputmode="numeric" style="width: 100%; min-width: 0; height: 64px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px">
        <input aria-label="Digit 4" value="" maxlength="1" inputmode="numeric" style="width: 100%; min-width: 0; height: 64px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: #ECEFF8; background: #182238; border: 1.5px solid #FFB347; border-radius: 12px; box-shadow: 0 0 0 3px rgba(255,179,71,.22)">
        <input aria-label="Digit 5" value="" maxlength="1" inputmode="numeric" style="width: 100%; min-width: 0; height: 64px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px">
        <input aria-label="Digit 6" value="" maxlength="1" inputmode="numeric" style="width: 100%; min-width: 0; height: 64px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: #ECEFF8; background: #182238; border: 1.5px solid #2A3757; border-radius: 12px">
