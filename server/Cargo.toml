[package]
name = "treehouse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Not "treehouse": the desktop app's binary is "Treehouse", and both land in
# the shared target/ dir on a case-insensitive filesystem. The image installs
# this as /usr/local/bin/treehouse.
[[bin]]
name = "treehouse-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "time", "uuid", "json"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1"
argon2 = "0.5"
base64 = "0.22"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
time = { version = "0.3", features = ["serde-well-known"] }
totp-rs = { version = "5", features = ["otpauth", "qr", "gen_secret"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zxcvbn = "3.1.1"
