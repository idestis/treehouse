# Throwaway Postgres and a dev LiveKit for local dev and integration tests (`task db`).
# Data lives in tmpfs: `docker compose -f deploy/docker-compose.test.yml down` wipes it.
name: treehouse-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: treehouse
      POSTGRES_PASSWORD: treehouse
      POSTGRES_DB: treehouse_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treehouse -d treehouse_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Voice for `task server:dev` (keys and webhook in livekit.dev.yaml).
  livekit:
    image: livekit/livekit-server:v1.9.3
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    # Webhooks go to the dev server on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
